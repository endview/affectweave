[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affectweave"
version = "0.2.0.dev0"
description = "Persistent affect, relationships, and character continuity for AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AffectWeave contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "affective-computing", "character", "emotion", "memory", "context-engineering", "state-management", "character-continuity"]

[project.scripts]
affectweave = "affectweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
